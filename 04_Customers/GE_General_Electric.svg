<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1729;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg8)"/>

  <!-- Title -->
  <text x="400" y="70" text-anchor="middle" style="font-size: 56px;">🏢</text>
  <text x="400" y="130" text-anchor="middle" style="font-size: 36px; font-weight: bold; fill: #f1f5f9;">General Electric</text>
  <text x="400" y="165" text-anchor="middle" style="font-size: 16px; fill: #ef4444;">COMPANY</text>
  <text x="400" y="190" text-anchor="middle" style="font-size: 14px; fill: #94a3b8;">세계에서 가장 강한 조직</text>

  <!-- 4 Pillars -->
  <g>
    <!-- Pillar 1 -->
    <rect x="80" y="230" width="140" height="150" rx="10" fill="rgba(239, 68, 68, 0.2)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="2"/>
    <text x="150" y="265" text-anchor="middle" style="font-size: 32px;">🌐</text>
    <text x="150" y="300" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #fca5a5;">Fortune 500</text>
    <text x="150" y="325" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">글로벌 기업</text>
    <text x="150" y="345" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">다각화 사업</text>
    <text x="150" y="365" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">세계 최대 규모</text>

    <!-- Pillar 2 -->
    <rect x="250" y="230" width="140" height="150" rx="10" fill="rgba(102, 126, 234, 0.2)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="320" y="265" text-anchor="middle" style="font-size: 32px;">🎓</text>
    <text x="320" y="300" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #a5b4fc;">크로톤빌</text>
    <text x="320" y="325" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">리더십 센터</text>
    <text x="320" y="345" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">인재 육성</text>
    <text x="320" y="365" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">교육 체계</text>

    <!-- Pillar 3 -->
    <rect x="420" y="230" width="140" height="150" rx="10" fill="rgba(74, 222, 128, 0.2)" stroke="rgba(74, 222, 128, 0.4)" stroke-width="2"/>
    <text x="490" y="265" text-anchor="middle" style="font-size: 32px;">⚙️</text>
    <text x="490" y="300" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #86efac;">6시그마</text>
    <text x="490" y="325" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">품질 혁신</text>
    <text x="490" y="345" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">프로세스 개선</text>
    <text x="490" y="365" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">데이터 기반</text>

    <!-- Pillar 4 -->
    <rect x="590" y="230" width="140" height="150" rx="10" fill="rgba(167, 139, 250, 0.2)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="2"/>
    <text x="660" y="265" text-anchor="middle" style="font-size: 32px;">💪</text>
    <text x="660" y="300" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #c4b5fd;">위크아웃</text>
    <text x="660" y="325" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">변화 프로그램</text>
    <text x="660" y="345" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">문제 해결</text>
    <text x="660" y="365" text-anchor="middle" style="font-size: 11px; fill: #cbd5e1;">참여 문화</text>
  </g>

  <!-- Core Methods -->
  <rect x="120" y="420" width="560" height="110" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2"/>
  <text x="400" y="450" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #f1f5f9;">GE 핵심 방법론</text>

  <g>
    <text x="150" y="480" style="font-size: 13px; fill: #cbd5e1;">✓ 세일즈 프로세스 13가지</text>
    <text x="150" y="505" style="font-size: 13px; fill: #cbd5e1;">✓ 변화 리더십 9가지</text>

    <text x="400" y="480" style="font-size: 13px; fill: #cbd5e1;">✓ 4E + V 인재 모델</text>
    <text x="400" y="505" style="font-size: 13px; fill: #cbd5e1;">✓ 액션러닝</text>

    <text x="580" y="480" style="font-size: 13px; fill: #cbd5e1;">✓ 비즈니스 역량</text>
    <text x="580" y="505" style="font-size: 13px; fill: #cbd5e1;">✓ 글로벌 미팅</text>
  </g>

  <!-- Footer -->
  <text x="400" y="565" text-anchor="middle" style="font-size: 13px; fill: #64748b;">
    체계적 비즈니스 프로세스와 강력한 인재 육성 시스템을 보유한 세계 최강 기업
  </text>
</svg>
