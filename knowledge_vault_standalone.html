        // 인포그래픽 그래프 뷰 렌더링 (파일별 맞춤)
        function renderInfographicGraphView() {
            const container = document.getElementById('infographicGraphView');

            // SVG 내보내기 버튼 추가
            const existingBtn = container.querySelector('.graph-export-btn');
            if (existingBtn) existingBtn.remove();

            const exportBtn = document.createElement('button');
            exportBtn.className = 'graph-export-btn';
            exportBtn.innerHTML = '💾 SVG 저장';
            exportBtn.onclick = () => exportInfographicGraphAsSVG();
            container.appendChild(exportBtn);

            const svg = d3.select('#infographicGraphSvg');
            svg.selectAll('*').remove();

            const width = container.clientWidth;
            const height = container.clientHeight;

            const g = svg.append('g');

            const zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => g.attr('transform', event.transform));
            svg.call(zoom);

            const colorMap = {
                'Methodology': '#667eea',
                'Concept': '#48bb78',
                'Person': '#ed8936',
                'Company': '#e53e3e',
                'Function': '#38b2ac',
                'Framework': '#805ad5',
                'Organization': '#805ad5',
                'Process': '#38b2ac'
            };

            // 현재 파일 관련 데이터만 필터링
            const relatedData = getRelatedNodes(state.currentFile);
            const filteredNodes = relatedData.nodes;
            const filteredEdges = relatedData.edges;

            // 노드가 없으면 메시지 표시
            if (filteredNodes.length === 0) {
                g.append('text')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '18px')
                    .attr('fill', 'var(--text-secondary)')
                    .text('이 파일과 관련된 온톨로지 노드가 없습니다');
                return;
            }

            const simulation = d3.forceSimulation(filteredNodes)
                .force('link', d3.forceLink(filteredEdges).id(d => d.id).distance(120))
                .force('charge', d3.forceManyBody().strength(-500))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(40));

            const link = g.append('g')
                .selectAll('line')
                .data(filteredEdges)
                .enter().append('line')
                .attr('stroke', '#999')
                .attr('stroke-opacity', 0.4)
                .attr('stroke-width', 1.5);

            // 엣지 레이블 배경 먼저 그리기
            const edgeLabelBg = g.append('g')
                .selectAll('rect')
                .data(filteredEdges.filter(d => d.relation))
                .enter().append('rect')
                .attr('fill', '#ffffff')
                .attr('stroke', '#667eea')
                .attr('stroke-width', 1.5)
                .attr('rx', 4)
                .attr('opacity', 0.95);

            // 엣지 레이블 추가 (관계 표시)
            const edgeLabel = g.append('g')
                .selectAll('text')
                .data(filteredEdges)
                .enter().append('text')
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'middle')
                .style('font-size', '9px')
                .style('fill', '#1a202c')
                .style('font-weight', '700')
                .style('pointer-events', 'none')
                .style('text-shadow', '0 1px 2px rgba(255,255,255,0.8)')
                .text(d => d.relation || '');

            const node = g.append('g')
                .selectAll('circle')
                .data(filteredNodes)
                .enter().append('circle')
                .attr('r', d => {
                    // 연결 수에 따라 크기 조정
                    const degree = filteredEdges.filter(e =>
                        e.source === d.id || e.target === d.id ||
                        e.source.id === d.id || e.target.id === d.id
                    ).length;
                    return 8 + Math.sqrt(degree) * 3;
                })
                .attr('fill', d => colorMap[d.type] || '#999')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2)
                .attr('opacity', 0.9)
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));

            node.append('title').text(d => `${d.label}\n타입: ${d.type}`);

            const label = g.append('g')
                .selectAll('text')
                .data(filteredNodes)
                .enter().append('text')
                .attr('dy', 25)
                .attr('text-anchor', 'middle')
                .style('font-size', '10px')
                .style('fill', 'var(--text-primary)')
                .style('font-weight', '600')
                .style('pointer-events', 'none')
                .text(d => d.label.length > 12 ? d.label.substring(0, 12) + '...' : d.label);

            simulation.on('tick', () => {
                link.attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                // 엣지 레이블 위치 (연결선 중간)
                edgeLabel
                    .attr('x', d => (d.source.x + d.target.x) / 2)
                    .attr('y', d => (d.source.y + d.target.y) / 2);

                // 엣지 레이블 배경
                edgeLabelBg.each(function(d) {
                    const textNode = edgeLabel.filter(e => e === d).node();
                    if (textNode) {
                        const bbox = textNode.getBBox();
                        d3.select(this)
                            .attr('x', bbox.x - 4)
                            .attr('y', bbox.y - 2)
                            .attr('width', bbox.width + 8)
                            .attr('height', bbox.height + 4);
                    }
                });

                node.attr('cx', d => d.x).attr('cy', d => d.y);
                label.attr('x', d => d.x).attr('y', d => d.y);
            });

            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }
        }

            if (!header || !modal) return;

            header.addEventListener('mousedown', (e) => {
                // 버튼 클릭은 무시
                if (e.target.closest('.chat-header-btn')) return;

                chatDragState.isDragging = true;
                modal.classList.add('dragging');

                const rect = modal.getBoundingClientRect();
                chatDragState.startX = e.clientX;
                chatDragState.startY = e.clientY;
                chatDragState.modalX = rect.left;
                chatDragState.modalY = rect.top;

                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!chatDragState.isDragging) return;

                const deltaX = e.clientX - chatDragState.startX;
                const deltaY = e.clientY - chatDragState.startY;

                const newX = chatDragState.modalX + deltaX;
                const newY = chatDragState.modalY + deltaY;

                // 화면 경계 체크
                const maxX = window.innerWidth - modal.offsetWidth;
                const maxY = window.innerHeight - modal.offsetHeight;

                const finalX = Math.max(0, Math.min(newX, maxX));
                const finalY = Math.max(0, Math.min(newY, maxY));

                modal.style.left = finalX + 'px';
                modal.style.top = finalY + 'px';
                modal.style.transform = 'none';
            });

            document.addEventListener('mouseup', () => {
                if (chatDragState.isDragging) {
                    chatDragState.isDragging = false;
                    modal.classList.remove('dragging');
                }
            });
        }

        // 키워드 정규화 (유사어 처리)
        function normalizeKeywords(query) {
            const synonyms = {
                '리더십': ['리더십', 'leadership', '리더', '지도력'],
                '변화': ['변화', 'change', '혁신', '개선'],
                '세일즈': ['세일즈', 'sales', '영업', '판매'],
                '인재': ['인재', 'talent', '인력', '사람'],
                '방법론': ['방법론', 'methodology', '프로세스', 'process', '절차'],
                '액션러닝': ['액션러닝', 'action learning', '실행학습'],
                '위크아웃': ['위크아웃', 'workout', '워크아웃'],
                '4e': ['4e', '4e+v', 'four e'],
                '잭웰치': ['잭웰치', 'jack welch', '웰치'],
                'ge': ['ge', 'general electric', '제너럴일렉트릭']
            };

            let expandedKeywords = [query.toLowerCase()];

            for (const [key, values] of Object.entries(synonyms)) {
                if (values.some(v => query.toLowerCase().includes(v))) {
                    expandedKeywords = [...expandedKeywords, ...values];
                    break;
                }
            }

            return expandedKeywords;
        }

        // 개선된 문서 검색
        function searchDocuments(query) {
            const results = [];
            const queryLower = query.toLowerCase();
            const keywords = normalizeKeywords(query);
            const queryWords = queryLower.split(/\s+/).filter(w => w.length > 1);

            // 모든 폴더와 파일 검색
            for (const [folder, files] of Object.entries(VAULT_DATA.files)) {
                files.forEach(file => {
                    const contentLower = file.content.toLowerCase();
                    const nameLower = file.name.toLowerCase();

                    let score = 0;
                    let matchCount = 0;

                    // 1. 파일명 매칭 (가중치 높음)
                    keywords.forEach(keyword => {
                        if (nameLower.includes(keyword.toLowerCase())) {
                            score += 20;
                            matchCount++;
                        }
                    });

                    // 2. 제목 매칭
                    const titleMatch = file.content.match(/title:\s*(.+)/);
                    if (titleMatch) {
                        const titleLower = titleMatch[1].toLowerCase();
                        keywords.forEach(keyword => {
                            if (titleLower.includes(keyword.toLowerCase())) {
                                score += 15;
                                matchCount++;
                            }
                        });
                    }

                    // 3. 본문 키워드 매칭
                    keywords.forEach(keyword => {
                        const matches = contentLower.split(keyword.toLowerCase()).length - 1;
                        score += matches * 2;
                        if (matches > 0) matchCount++;
                    });

                    // 4. 질문 단어 매칭
                    queryWords.forEach(word => {
                        if (contentLower.includes(word)) {
                            score += 1;
                        }
                    });

                    // 5. 섹션 헤더 매칭 (가중치 중간)
                    const headers = file.content.match(/##\s*\d*\.\s*(.+)/g);
                    if (headers) {
                        headers.forEach(header => {
                            keywords.forEach(keyword => {
                                if (header.toLowerCase().includes(keyword.toLowerCase())) {
                                    score += 5;
                                }
                            });
                        });
                    }

                    // 매칭이 있는 경우만 추가
                    if (score > 0 || matchCount > 0) {
                        results.push({
                            folder,
                            filename: file.name,
                            content: file.content,
                            score,
                            matchCount
                        });
                    }
                });
            }

            // 점수 순으로 정렬 (점수 같으면 매칭 개수로)
            results.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return b.matchCount - a.matchCount;
            });

            return results.slice(0, 5); // 상위 5개
        }

        // 온톨로지 노드 검색
        function searchOntologyNodes(query) {
            const queryLower = query.toLowerCase();
            return VAULT_DATA.ontology.nodes.filter(node => {
                return node.label.toLowerCase().includes(queryLower) ||
                       (node.description && node.description.toLowerCase().includes(queryLower));
            }).slice(0, 5);
        }

        // 질문 의도 파악
        function analyzeQuestionIntent(question) {
            const q = question.toLowerCase();

            if (q.includes('차이') || q.includes('비교') || q.includes('구별')) {
                return 'compare';
            }
            if (q.includes('어떻게') || q.includes('방법') || q.includes('적용')) {
                return 'how';
            }
            if (q.includes('왜') || q.includes('이유') || q.includes('목적')) {
                return 'why';
            }
            if (q.includes('예시') || q.includes('사례') || q.includes('예제')) {
                return 'example';
            }
            if (q.includes('요약') || q.includes('정리') || q.includes('간단히')) {
                return 'summary';
            }
            if (q.includes('단계') || q.includes('절차') || q.includes('프로세스')) {
                return 'steps';
            }
            if (q.includes('장점') || q.includes('단점') || q.includes('효과')) {
                return 'pros_cons';
            }
            if (q.includes('표') || q.includes('목록') || q.includes('리스트')) {
                return 'list';
            }

            return 'what'; // 기본: 정의/설명
        }

        // 섹션별 내용 추출 함수
        function extractSection(content, sectionName) {
            const regex = new RegExp(`##\\s*\\d*\\.?\\s*${sectionName}\\s*([\\s\\S]*?)(?=\\n##|$)`, 'i');
            const match = content.match(regex);
            return match ? match[1].trim() : null;
        }

        // 번호 리스트 추출
        function extractNumberedList(text) {
            const items = text.match(/\d+\.\s*\*\*(.+?)\*\*[:\s]*([\s\S]*?)(?=\n\d+\.|$)/g);
            if (!items) return null;

            let result = '';
            items.forEach(item => {
                const match = item.match(/(\d+)\.\s*\*\*(.+?)\*\*[:\s]*([\s\S]*)/);
                if (match) {
                    const num = match[1];
                    const title = match[2];
                    const desc = match[3].trim().split('\n')[0]; // 첫 줄만
                    result += `${num}. **${title}**\n   ${desc}\n\n`;
                }
            });
            return result;
        }

        // 불릿 리스트 추출
        function extractBulletList(text) {
            const items = text.match(/[-•]\s*\*\*(.+?)\*\*[:\s]*(.+?)(?=\n[-•]|\n\n|$)/g);
            if (!items) return null;

            let result = '';
            items.forEach(item => {
                result += item.trim() + '\n';
            });
            return result;
        }

        // 문서에서 답변 추출 (개선 버전)
        function extractAnswer(documents, question) {
            if (documents.length === 0) {
                return null;
            }

            const intent = analyzeQuestionIntent(question);
            const questionLower = question.toLowerCase();
            let answer = '';

            // 관련도 높은 상위 문서들
            const topDocs = documents.slice(0, 3);

            // 비교 질문인 경우 (예: "위크아웃과 액션러닝의 차이")
            if (intent === 'compare' && topDocs.length >= 2) {
                const doc1 = topDocs[0];
                const doc2 = topDocs[1];

                const title1 = doc1.content.match(/title:\s*(.+)/)?.[1] || doc1.filename.replace('.md', '');
                const title2 = doc2.content.match(/title:\s*(.+)/)?.[1] || doc2.filename.replace('.md', '');

                answer = `**${title1} vs ${title2} 비교**\n\n`;

                const def1 = extractSection(doc1.content, '한 줄 정의') || extractSection(doc1.content, '핵심 요약');
                const def2 = extractSection(doc2.content, '한 줄 정의') || extractSection(doc2.content, '핵심 요약');

                if (def1) {
                    answer += `**${title1}:**\n${def1.substring(0, 300)}\n\n`;
                }
                if (def2) {
                    answer += `**${title2}:**\n${def2.substring(0, 300)}\n\n`;
                }

                answer += '**주요 차이점:**\n';
                answer += `• ${title1}은(는) ${doc1.content.includes('방법론') ? '방법론' : '프레임워크'}\n`;
                answer += `• ${title2}은(는) ${doc2.content.includes('방법론') ? '방법론' : '프레임워크'}\n`;

                return answer.trim();
            }

            // 단일 문서 기반 답변
            const topDoc = topDocs[0];
            const content = topDoc.content;

            const titleMatch = content.match(/title:\s*(.+)/);
            const title = titleMatch ? titleMatch[1].trim() : topDoc.filename.replace('.md', '');

            answer = `**${title}**\n\n`;

            // 의도별 답변 생성
            switch (intent) {
                case 'summary':
                case 'what':
                    // 한 줄 정의
                    const definition = extractSection(content, '한 줄 정의');
                    if (definition) {
                        answer += `📌 ${definition}\n\n`;
                    }

                    // 핵심 요약
                    const summary = extractSection(content, '핵심 요약');
                    if (summary) {
                        answer += `**핵심 내용:**\n${summary.substring(0, 600)}\n\n`;
                    }

                    // 특수 패턴 추출
                    const specialPatterns = [
                        { regex: /\*\*9가지 핵심 리더십 자질:\*\*\s*([\s\S]*?)(?=\n####|\n##|$)/, title: '9가지 핵심 리더십' },
                        { regex: /\*\*13가지 세일즈 성공법칙:\*\*\s*([\s\S]*?)(?=\n##|$)/, title: '13가지 성공법칙' },
                        { regex: /\*\*4E \+ V 모델:\*\*\s*([\s\S]*?)(?=\n##|$)/, title: '4E+V 인재모델' },
                        { regex: /\*\*10 Steps of Sales Process:\*\*\s*([\s\S]*?)(?=\n##|$)/, title: '세일즈 10단계' }
                    ];

                    for (const pattern of specialPatterns) {
                        const match = content.match(pattern.regex);
                        if (match) {
                            answer += `**${pattern.title}:**\n`;
                            const numberedList = extractNumberedList(match[1]);
                            if (numberedList) {
                                answer += numberedList;
                            } else {
                                answer += match[1].substring(0, 800) + '\n';
                            }
                            return answer.trim();
                        }
                    }
                    break;

                case 'how':
                    // 방법, 절차, 적용
                    const howSection = extractSection(content, '해결 방식') ||
                                     extractSection(content, '적용 방법') ||
                                     extractSection(content, '실행 단계');
                    if (howSection) {
                        answer += `**적용 방법:**\n${howSection.substring(0, 600)}\n\n`;
                    }

                    const stepsSection = extractSection(content, '주요 단계') ||
                                       extractSection(content, '프로세스');
                    if (stepsSection) {
                        const steps = extractNumberedList(stepsSection);
                        if (steps) {
                            answer += `**단계별 프로세스:**\n${steps}\n`;
                        }
                    }
                    break;

                case 'why':
                    // 이유, 목적
                    const problem = extractSection(content, '관련 문제') ||
                                  extractSection(content, '배경');
                    if (problem) {
                        answer += `**배경/문제:**\n${problem.substring(0, 400)}\n\n`;
                    }

                    const purpose = extractSection(content, '목적') ||
                                  extractSection(content, '필요성');
                    if (purpose) {
                        answer += `**목적:**\n${purpose.substring(0, 400)}\n\n`;
                    }
                    break;

                case 'example':
                    // 예시, 사례
                    const examples = extractSection(content, '사례') ||
                                   extractSection(content, '예시') ||
                                   extractSection(content, '적용 사례');
                    if (examples) {
                        answer += `**사례:**\n${examples.substring(0, 600)}\n\n`;
                    }
                    break;

                case 'steps':
                    // 단계별 절차
                    const allSteps = content.match(/\d+\.\s*\*\*.+?\*\*[\s\S]*?(?=\n\d+\.|\n##|$)/g);
                    if (allSteps && allSteps.length > 0) {
                        answer += `**단계별 절차:**\n\n`;
                        allSteps.slice(0, 15).forEach(step => {
                            answer += step.trim() + '\n\n';
                        });
                    }
                    break;

                case 'pros_cons':
                    // 장단점, 효과
                    const benefits = extractSection(content, '장점') ||
                                   extractSection(content, '효과') ||
                                   extractSection(content, '기대 효과');
                    if (benefits) {
                        answer += `**효과/장점:**\n${benefits.substring(0, 400)}\n\n`;
                    }
                    break;

                case 'list':
                    // 목록 형태
                    const bullets = extractBulletList(content);
                    if (bullets) {
                        answer += `**주요 항목:**\n${bullets}\n`;
                    }
                    break;
            }

            // 기본 섹션이 없으면 핵심 요약 사용
            if (answer === `**${title}**\n\n`) {
                const summary = extractSection(content, '핵심 요약') ||
                              extractSection(content, '한 줄 정의');
                if (summary) {
                    answer += summary.substring(0, 800);
                }
            }

            // 연결된 개념 추가
            const relatedSection = extractSection(content, '연결 노트') ||
                                 extractSection(content, '관련 개념');
            if (relatedSection) {
                const links = relatedSection.match(/\[\[(.+?)\]\]/g);
                if (links && links.length > 0) {
                    answer += '\n\n**관련 개념:**\n';
                    links.slice(0, 5).forEach(link => {
                        const concept = link.replace(/\[\[|\]\]/g, '');
                        answer += `• ${concept}\n`;
                    });
                }
            }

            return answer.trim();
        }

        async function callRAGAPI(question) {
            // ========== Claude CLI 백엔드 호출 ==========
            // 로컬 프록시 서버 (claude-proxy-server.js) 사용

            const USE_CLAUDE_CLI = true; // true: CLI 백엔드, false: 로컬 답변 추출

            if (USE_CLAUDE_CLI) {
                try {
                    console.log('🤖 Claude CLI 백엔드 호출 중...');

                    const response = await fetch('http://localhost:3000/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question })
                    });

                    if (!response.ok) {
                        throw new Error(`서버 오류: ${response.status}`);
                    }

                    const data = await response.json();

                    removeLoadingMessage();
                    isWaitingForResponse = false;

                    addMessage('bot', data.answer, data.sources);
                    chatHistory.push({ role: 'assistant', content: data.answer });

                    console.log('✅ Claude CLI 답변 완료');
                    return;

                } catch (error) {
                    console.error('❌ Claude CLI 오류:', error);

                    removeLoadingMessage();
                    isWaitingForResponse = false;

                    const errorMsg = `⚠️ Claude CLI 백엔드에 연결할 수 없습니다.\n\n` +
                        `**해결 방법:**\n` +
                        `1. 터미널에서 프록시 서버 실행:\n` +
                        `   \`node claude-proxy-server.js\`\n\n` +
                        `2. 서버 실행 확인:\n` +
                        `   http://localhost:3000/health\n\n` +
                        `**임시 대응:** 로컬 답변 추출 모드로 전환합니다.`;

                    addMessage('bot', errorMsg, []);
                    // 로컬 모드로 fallback
                }
            }

            // ========== 로컬 답변 추출 모드 (fallback) ==========
            removeLoadingMessage();
            isWaitingForResponse = false;

            // 1. 문서 검색
            const documents = searchDocuments(question);
            console.log('📄 검색된 문서:', documents);

            // 2. 온톨로지 노드 검색
            const nodes = searchOntologyNodes(question);
            console.log('🕸️ 검색된 노드:', nodes);

            // 3. 답변 생성
            let answer = '';
            let sources = [];

            if (documents.length > 0) {
                const extractedAnswer = extractAnswer(documents, question);
                if (extractedAnswer) {
                    answer = extractedAnswer;

                    // 추가 제안
                    if (nodes.length > 0) {
                        answer += '\n\n💡 **관련 개념을 더 알아보세요:**\n';
                        nodes.slice(0, 3).forEach(node => {
                            answer += `• ${node.label}\n`;
                        });
                    }
                } else {
                    answer = `관련 문서를 찾았지만 구체적인 답변을 추출할 수 없습니다. 아래 문서를 직접 확인해주세요.`;
                }

                // 출처 추가
                documents.slice(0, 3).forEach(doc => {
                    const titleMatch = doc.content.match(/title:\s*(.+)/);
                    const title = titleMatch ? titleMatch[1].trim() : doc.filename.replace('.md', '');
                    sources.push({
                        type: 'file',
                        title: `📄 ${title}`,
                        folder: doc.folder,
                        filename: doc.filename
                    });
                });
            } else if (nodes.length > 0) {
                // 문서는 없지만 노드가 있는 경우
                answer = `"${question}"에 대한 상세 문서는 없지만, 관련 개념을 찾았습니다.\n\n`;
                answer += '**관련 개념:**\n';
                nodes.slice(0, 5).forEach(node => {
                    answer += `• ${node.label}`;
                    if (node.description) {
                        answer += `: ${node.description.substring(0, 100)}`;
                    }
                    answer += '\n';
                });
                answer += '\n아래 개념을 클릭하여 자세히 알아보세요.';
            } else {
                // 아무것도 찾지 못한 경우
                answer = `💬 "${question}"에 대한 답변을 찾을 수 없습니다.\n\n`;
                answer += '다음 방법을 시도해보세요:\n\n';
                answer += '1️⃣ **더 구체적인 키워드 사용**\n';
                answer += '   예: "변화리더십", "세일즈", "4E+V"\n\n';
                answer += '2️⃣ **다른 표현 시도**\n';
                answer += '   예: "9가지" → "핵심 리더십"\n\n';
                answer += '3️⃣ **Knowledge Vault에 포함된 주제:**\n';
                answer += '   • GE 비즈니스 방법론\n';
                answer += '   • 변화리더십 (9가지 핵심)\n';
                answer += '   • 세일즈 프로세스 (13단계)\n';
                answer += '   • 인재육성 (4E+V)\n';
                answer += '   • 위크아웃 & 액션러닝\n';
                answer += '   • 소통 & 타운미팅\n\n';
                answer += '💡 왼쪽 사이드바에서 문서를 직접 탐색할 수도 있습니다.';
            }

            // 온톨로지 노드도 출처에 추가
            if (nodes.length > 0 && documents.length > 0) {
                nodes.slice(0, 2).forEach(node => {
                    sources.push({
                        type: 'node',
                        title: `🕸️ ${node.label}`,
                        nodeId: node.id
                    });
                });
            } else if (nodes.length > 0) {
                nodes.slice(0, 5).forEach(node => {
                    sources.push({
                        type: 'node',
                        title: `🕸️ ${node.label}`,
                        nodeId: node.id
                    });
                });
            }

            addMessage('bot', answer, sources);
            chatHistory.push({ role: 'assistant', content: answer });
        }

        // 채팅 입력창 자동 높이 조절 및 드래그 초기화
        document.addEventListener('DOMContentLoaded', () => {
            // 드래그 기능 초기화
            initChatDrag();

            const chatInput = document.getElementById('chatInput');
            if (chatInput) {
                chatInput.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
                });

                // Enter 키로 전송
                chatInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
            }
        });
    </script>

    <!-- ========== Chatbot UI ========== -->

    <!-- Floating Chat Button -->
    <button class="chat-button" onclick="toggleChat()" title="AI 챗봇 열기">
        💬
    </button>

    <!-- Chat Modal (Floating, Draggable) -->
    <div class="chat-modal" id="chatModal">
        <!-- Header (Draggable) -->
        <div class="chat-header" id="chatHeader">
            <div class="chat-header-title">
                <span>🤖</span>
                <span>Knowledge Vault AI</span>
            </div>
            <div class="chat-header-actions">
                <button class="chat-header-btn" onclick="minimizeChat()" title="최소화">
                    −
                </button>
                <button class="chat-header-btn chat-header-close" onclick="toggleChat()" title="닫기">
                    ×
                </button>
            </div>
        </div>

        <!-- Body (Messages) -->
        <div class="chat-body" id="chatBody">
            <!-- Messages will be added here dynamically -->
        </div>

        <!-- Footer (Input) -->
        <div class="chat-footer">
            <textarea
                class="chat-input"
                id="chatInput"
                placeholder="질문을 입력하세요... (Enter: 전송, Shift+Enter: 줄바꿈)"
                rows="1"
            ></textarea>
            <button class="chat-send-btn" onclick="sendMessage()" id="chatSendBtn">
                ▲
            </button>
        </div>
    </div>

</body>
</html>
