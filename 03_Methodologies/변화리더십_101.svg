  <g transform="translate(390, 270)">
    <circle cx="0" cy="0" r="45" fill="rgba(74, 222, 128, 0.4)" stroke="rgba(74, 222, 128, 0.8)" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" style="font-size: 22px;">🎉</text>
