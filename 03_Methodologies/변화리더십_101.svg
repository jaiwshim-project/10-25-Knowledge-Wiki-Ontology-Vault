    <text x="100" y="30" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #86efac;">액션러닝</text>
    <text x="100" y="50" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Action Learning</text>
    <text x="100" y="67" text-anchor="middle" style="font-size: 10px; fill: #94a3b8;">실천 기반 학습</text>
  </g>

