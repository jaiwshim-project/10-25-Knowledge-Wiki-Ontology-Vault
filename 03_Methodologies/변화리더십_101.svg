<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1729;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="45%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg4)"/>
  <circle cx="600" cy="400" r="300" fill="url(#glow4)"/>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" style="font-size: 56px;">🚀</text>
  <text x="600" y="130" text-anchor="middle" style="font-size: 36px; font-weight: bold; fill: #f1f5f9;">
    변화 리더십 101
  </text>
  <text x="600" y="165" text-anchor="middle" style="font-size: 15px; fill: #a78bfa;">
    CHANGE LEADERSHIP | 잭 웰치의 변화관리 방법론
  </text>

  <!-- Central Circle with 9 Leadership Qualities -->
  <circle cx="600" cy="450" r="240" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(167, 139, 250, 0.6)" stroke-width="3"/>

