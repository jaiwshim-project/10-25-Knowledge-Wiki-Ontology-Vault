    <text x="100" y="30" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #c4b5fd;">파이프라인</text>
    <text x="100" y="50" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Pipeline</text>
    <text x="100" y="67" text-anchor="middle" style="font-size: 10px; fill: #94a3b8;">리더십 개발 체계</text>
  </g>

  <g transform="translate(860, 780)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="rgba(239, 68, 68, 0.2)" stroke="rgba(239, 68, 68, 0.5)" stroke-width="2"/>
    <text x="70" y="30" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #fca5a5;">6시그마</text>
    <text x="70" y="50" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Six Sigma</text>
    <text x="70" y="67" text-anchor="middle" style="font-size: 10px; fill: #94a3b8;">품질 혁신</text>
