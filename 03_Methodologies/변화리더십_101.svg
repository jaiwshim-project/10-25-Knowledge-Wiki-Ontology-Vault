    <text x="0" y="-8" text-anchor="middle" style="font-size: 22px;">💬</text>
    <text x="0" y="12" text-anchor="middle" style="font-size: 12px; font-weight: bold; fill: #e2e8f0;">Comm.</text>
    <text x="0" y="27" text-anchor="middle" style="font-size: 9px; fill: #94a3b8;">소통</text>
  </g>

  <!-- 7. Left -->
  <g transform="translate(340, 450)">
    <circle cx="0" cy="0" r="45" fill="rgba(74, 222, 128, 0.4)" stroke="rgba(74, 222, 128, 0.8)" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" style="font-size: 22px;">🚀</text>
    <text x="0" y="12" text-anchor="middle" style="font-size: 12px; font-weight: bold; fill: #e2e8f0;">Execute</text>
    <text x="0" y="27" text-anchor="middle" style="font-size: 9px; fill: #94a3b8;">실행력</text>
  </g>

