    <text x="100" y="30" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #86efac;">위크아웃</text>
    <text x="100" y="50" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">WorkOut</text>
