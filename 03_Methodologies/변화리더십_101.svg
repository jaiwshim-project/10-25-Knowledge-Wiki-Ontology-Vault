    <text x="0" y="12" text-anchor="middle" style="font-size: 12px; font-weight: bold; fill: #e2e8f0;">Vision</text>
    <text x="0" y="27" text-anchor="middle" style="font-size: 9px; fill: #94a3b8;">비전 메이커</text>
  </g>

