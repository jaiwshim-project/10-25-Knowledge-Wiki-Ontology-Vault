<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1729;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" style="font-size: 56px;">📊</text>
  <text x="600" y="130" text-anchor="middle" style="font-size: 36px; font-weight: bold; fill: #f1f5f9;">
    세일즈 프로세스 13가지 성공법칙
  </text>
  <text x="600" y="165" text-anchor="middle" style="font-size: 15px; fill: #94a3b8;">
    GE 프로들이 사용하는 실전 세일즈 전략 | 15년 실무 노하우
  </text>

  <line x1="300" y1="185" x2="900" y2="185" stroke="rgba(102, 126, 234, 0.3)" stroke-width="2"/>

  <!-- 13 Laws in 3 rows -->
  <!-- Row 1 -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(102, 126, 234, 0.15)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #a5b4fc;">법칙 1</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">고객을 중심에</text>
    <text x="120" y="80" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">두어라</text>
    <text x="120" y="100" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Customer Centric</text>
  </g>

  <g transform="translate(360, 220)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(102, 126, 234, 0.15)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #a5b4fc;">법칙 2</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">Pull형이 되어라</text>
    <text x="120" y="85" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">강압 X, 솔루션 제공</text>
  </g>

  <g transform="translate(620, 220)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(102, 126, 234, 0.15)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #a5b4fc;">법칙 3</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">스토리가</text>
    <text x="120" y="80" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">중요하다</text>
    <text x="120" y="100" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Storytelling</text>
  </g>

  <g transform="translate(880, 220)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(102, 126, 234, 0.15)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #a5b4fc;">법칙 4</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">고객 니즈</text>
    <text x="120" y="80" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">해결책</text>
    <text x="120" y="100" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Needs Solution</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(102, 126, 234, 0.15)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #a5b4fc;">법칙 5</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">포기하지 말라</text>
    <text x="120" y="85" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">실패는 포기에서</text>
  </g>

  <g transform="translate(360, 350)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(102, 126, 234, 0.15)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #a5b4fc;">법칙 6</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">상담의 질</text>
    <text x="120" y="80" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">높여라</text>
    <text x="120" y="100" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Quality over Quantity</text>
  </g>

  <g transform="translate(620, 350)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(102, 126, 234, 0.15)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #a5b4fc;">법칙 7</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">신뢰 구축</text>
    <text x="120" y="85" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Trust Building</text>
  </g>

  <g transform="translate(880, 350)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(102, 126, 234, 0.15)" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #a5b4fc;">법칙 8</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 14px; fill: #cbd5e1;">가치 제안</text>
    <text x="120" y="85" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">Value Proposition</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(230, 480)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(167, 139, 250, 0.15)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #c4b5fd;">법칙 9-13</text>
    <text x="120" y="65" text-anchor="middle" style="font-size: 13px; fill: #cbd5e1;">+ 5가지 추가 법칙</text>
    <text x="120" y="90" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">실전 노하우 수록</text>
  </g>

  <!-- Supporting Methods -->
  <g transform="translate(490, 480)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(74, 222, 128, 0.15)" stroke="rgba(74, 222, 128, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #86efac;">AIDAS 법칙</text>
    <text x="120" y="60" text-anchor="middle" style="font-size: 12px; fill: #cbd5e1;">Attention → Interest</text>
    <text x="120" y="78" text-anchor="middle" style="font-size: 12px; fill: #cbd5e1;">→ Desire → Action</text>
    <text x="120" y="96" text-anchor="middle" style="font-size: 12px; fill: #cbd5e1;">→ Satisfaction</text>
  </g>

  <g transform="translate(750, 480)">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="rgba(74, 222, 128, 0.15)" stroke="rgba(74, 222, 128, 0.4)" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" style="font-size: 18px; font-weight: bold; fill: #86efac;">10 Steps</text>
    <text x="120" y="63" text-anchor="middle" style="font-size: 12px; fill: #cbd5e1;">세일즈 프로세스</text>
    <text x="120" y="85" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">체계적 접근 방법</text>
  </g>

  <!-- Key Components -->
  <rect x="200" y="630" width="800" height="180" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(102, 126, 234, 0.3)" stroke-width="2"/>
  <text x="600" y="670" text-anchor="middle" style="font-size: 20px; font-weight: bold; fill: #f1f5f9;">핵심 구성 요소</text>
  <line x1="250" y1="685" x2="950" y2="685" stroke="rgba(102, 126, 234, 0.2)" stroke-width="1"/>

  <g transform="translate(250, 710)">
    <text x="0" y="0" style="font-size: 16px; font-weight: bold; fill: #a5b4fc;">Boss Managing</text>
    <text x="0" y="25" style="font-size: 13px; fill: #cbd5e1;">• 상사를 효과적으로 관리</text>
    <text x="0" y="45" style="font-size: 13px; fill: #cbd5e1;">• 조직 내 지원 확보</text>
    <text x="0" y="65" style="font-size: 13px; fill: #cbd5e1;">• 리소스 활용 극대화</text>
  </g>

  <g transform="translate(550, 710)">
    <text x="0" y="0" style="font-size: 16px; font-weight: bold; fill: #a5b4fc;">Customer Managing</text>
    <text x="0" y="25" style="font-size: 13px; fill: #cbd5e1;">• 고객 관계 구축</text>
    <text x="0" y="45" style="font-size: 13px; fill: #cbd5e1;">• 니즈 파악 및 대응</text>
    <text x="0" y="65" style="font-size: 13px; fill: #cbd5e1;">• 장기 파트너십</text>
  </g>

  <!-- Footer -->
  <text x="600" y="860" text-anchor="middle" style="font-size: 13px; fill: #64748b;">
    출처: 서적 4 - GE의 세일즈 노트.pdf | 저자: 심재우 | GE 15년 실전 경험
  </text>
</svg>
