            font-size: 0.85rem;
            color: #64748b;

            align-items: center;
            gap: 6px;

                    <text x="20" y="170" style="font-size: 13px; fill: #cbd5e1;">📚 6권 저서</text>
                    <text x="20" y="195" style="font-size: 13px; fill: #cbd5e1;">🎓 아주대 초빙강사</text>
                    <text x="20" y="220" style="font-size: 13px; fill: #cbd5e1;">💼 SB 컨설팅 대표</text>
                `
            }
        ];

        function createDocCard(doc) {
            return `
                <div class="doc-card">
                    <div class="doc-card-svg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 360 260">
                            ${doc.svgContent}
                        </svg>
                    </div>
                    <div class="doc-card-content">
                        <span class="doc-type-badge ${doc.typeClass}">${doc.type}</span>
                        <h3 class="doc-card-title">${doc.icon} ${doc.title}</h3>
                        <p class="doc-card-desc">${doc.description}</p>
                        <div class="doc-card-meta">
                            <span class="meta-item">📄 ${doc.lines}줄</span>
                            <span class="meta-item">📅 ${doc.created}</span>
                        </div>
                    </div>
                    <div class="doc-card-footer">
                        <div class="tags">
                            ${doc.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <button class="view-btn" onclick="viewDocument('${doc.id}')">보기 →</button>
                    </div>
                </div>
            `;
        }

        function viewDocument(docId) {
            // Knowledge Vault로 이동하면서 해당 문서 검색
            const doc = documents.find(d => d.id === docId);
            if (doc) {
                window.location.href = `knowledge_vault_premium.html?search=${encodeURIComponent(doc.title)}`;
            }
        }

        // Render gallery
        document.getElementById('gallery').innerHTML = documents.map(doc => createDocCard(doc)).join('');
    </script>
</body>
</html>
