<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1729;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#48bb78;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg5)"/>
  <ellipse cx="400" cy="250" rx="350" ry="200" fill="url(#glow5)"/>

  <!-- Title -->
  <text x="400" y="70" text-anchor="middle" style="font-size: 52px;">⭐</text>
  <text x="400" y="120" text-anchor="middle" style="font-size: 32px; font-weight: bold; fill: #f1f5f9;">
    4E + V 인재육성 모델
  </text>
  <text x="400" y="150" text-anchor="middle" style="font-size: 15px; fill: #48bb78;">
    CONCEPT
  </text>
  <text x="400" y="175" text-anchor="middle" style="font-size: 14px; fill: #94a3b8;">
    GE의 인재 선발 및 육성 핵심 역량 모델
  </text>

  <!-- Central Pentagon with 4E+V -->
  <g transform="translate(400, 320)">
    <!-- Pentagon Shape -->
    <polygon points="0,-120 114,-37 70,97 -70,97 -114,-37"
             fill="rgba(30, 41, 59, 0.8)"
             stroke="rgba(74, 222, 128, 0.6)"
             stroke-width="3"/>

    <!-- Center Circle -->
    <circle cx="0" cy="0" r="50" fill="rgba(74, 222, 128, 0.3)" stroke="rgba(74, 222, 128, 0.7)" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" style="font-size: 22px; font-weight: bold; fill: #86efac;">4E</text>
    <text x="0" y="15" text-anchor="middle" style="font-size: 20px; font-weight: bold; fill: #86efac;">+</text>
    <text x="0" y="40" text-anchor="middle" style="font-size: 22px; font-weight: bold; fill: #86efac;">V</text>

    <!-- E1: Energy (Top) -->
    <circle cx="0" cy="-120" r="45" fill="rgba(102, 126, 234, 0.4)" stroke="rgba(102, 126, 234, 0.8)" stroke-width="2.5"/>
    <text x="0" y="-135" text-anchor="middle" style="font-size: 28px;">⚡</text>
    <text x="0" y="-110" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #f1f5f9;">Energy</text>
    <text x="0" y="-90" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">열정과 추진력</text>

    <!-- E2: Energize (Top-Right) -->
    <circle cx="114" cy="-37" r="45" fill="rgba(102, 126, 234, 0.4)" stroke="rgba(102, 126, 234, 0.8)" stroke-width="2.5"/>
    <text x="114" y="-52" text-anchor="middle" style="font-size: 28px;">🔥</text>
    <text x="114" y="-27" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #f1f5f9;">Energize</text>
    <text x="114" y="-7" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">동기부여</text>

    <!-- E3: Edge (Bottom-Right) -->
    <circle cx="70" cy="97" r="45" fill="rgba(167, 139, 250, 0.4)" stroke="rgba(167, 139, 250, 0.8)" stroke-width="2.5"/>
    <text x="70" y="82" text-anchor="middle" style="font-size: 28px;">⚔️</text>
    <text x="70" y="107" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #f1f5f9;">Edge</text>
    <text x="70" y="127" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">결단력</text>

    <!-- E4: Execute (Bottom-Left) -->
    <circle cx="-70" cy="97" r="45" fill="rgba(167, 139, 250, 0.4)" stroke="rgba(167, 139, 250, 0.8)" stroke-width="2.5"/>
    <text x="-70" y="82" text-anchor="middle" style="font-size: 28px;">🚀</text>
    <text x="-70" y="107" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #f1f5f9;">Execute</text>
    <text x="-70" y="127" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">실행력</text>

    <!-- V: Values (Top-Left) -->
    <circle cx="-114" cy="-37" r="45" fill="rgba(251, 146, 60, 0.4)" stroke="rgba(251, 146, 60, 0.8)" stroke-width="2.5"/>
    <text x="-114" y="-52" text-anchor="middle" style="font-size: 28px;">💎</text>
    <text x="-114" y="-27" text-anchor="middle" style="font-size: 16px; font-weight: bold; fill: #f1f5f9;">Values</text>
    <text x="-114" y="-7" text-anchor="middle" style="font-size: 11px; fill: #94a3b8;">가치</text>

    <!-- Connecting Lines -->
    <line x1="0" y1="-70" x2="0" y2="-50" stroke="rgba(74, 222, 128, 0.4)" stroke-width="2"/>
    <line x1="70" y1="-20" x2="50" y2="-10" stroke="rgba(74, 222, 128, 0.4)" stroke-width="2"/>
    <line x1="44" y1="52" x2="35" y2="40" stroke="rgba(74, 222, 128, 0.4)" stroke-width="2"/>
    <line x1="-44" y1="52" x2="-35" y2="40" stroke="rgba(74, 222, 128, 0.4)" stroke-width="2"/>
    <line x1="-70" y1="-20" x2="-50" y2="-10" stroke="rgba(74, 222, 128, 0.4)" stroke-width="2"/>
  </g>

  <!-- Footer Info -->
  <text x="400" y="540" text-anchor="middle" style="font-size: 13px; fill: #64748b;">
    출처: 서적8 - GE는 어떻게 수퍼급 인재를 만드는가.pdf
  </text>
  <text x="400" y="565" text-anchor="middle" style="font-size: 12px; fill: #64748b;">
    GE의 인재 선발, 교육, 평가, 승진의 핵심 기준
  </text>
</svg>
