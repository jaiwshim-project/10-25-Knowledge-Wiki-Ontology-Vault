<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f1729;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  <circle cx="350" cy="250" r="200" fill="url(#glow1)"/>
  <circle cx="850" cy="550" r="180" fill="url(#glow2)"/>

  <!-- Title Section -->
  <text x="600" y="80" text-anchor="middle" style="font-size: 72px;">🏠</text>
  <text x="600" y="140" text-anchor="middle" style="font-size: 42px; font-weight: bold; fill: #f1f5f9;">
    심재우 저서 Knowledge Vault
  </text>
  <text x="600" y="175" text-anchor="middle" style="font-size: 16px; fill: #94a3b8;">
    GE 비즈니스 방법론 6권 → Obsidian Wiki + 온톨로지 지식 그래프 구조화
  </text>

  <!-- Main Stats -->
  <g transform="translate(600, 220)">
    <rect x="-350" y="0" width="700" height="80" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(102, 126, 234, 0.3)" stroke-width="2"/>

    <text x="-280" y="30" style="font-size: 32px; font-weight: bold; fill: #667eea;">38</text>
    <text x="-280" y="55" style="font-size: 13px; fill: #cbd5e1;">지식 노드</text>

    <text x="-80" y="30" style="font-size: 32px; font-weight: bold; fill: #a78bfa;">50</text>
    <text x="-80" y="55" style="font-size: 13px; fill: #cbd5e1;">관계 엣지</text>

    <text x="100" y="30" style="font-size: 32px; font-weight: bold; fill: #48bb78;">9</text>
    <text x="100" y="55" style="font-size: 13px; fill: #cbd5e1;">Wiki 문서</text>

    <text x="260" y="30" style="font-size: 32px; font-weight: bold; fill: #f59e0b;">6</text>
    <text x="260" y="55" style="font-size: 13px; fill: #cbd5e1;">원본 서적</text>
  </g>

  <!-- Section 1: Projects -->
  <g transform="translate(150, 340)">
    <rect x="0" y="0" width="450" height="200" rx="15" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(102, 126, 234, 0.3)" stroke-width="2"/>
    <text x="225" y="35" text-anchor="middle" style="font-size: 24px; font-weight: bold; fill: #667eea;">📖 핵심 프로젝트</text>
    <line x1="20" y1="50" x2="430" y2="50" stroke="rgba(102, 126, 234, 0.2)" stroke-width="1"/>

    <circle cx="30" cy="80" r="5" fill="#a5b4fc"/>
    <text x="45" y="85" style="font-size: 15px; fill: #e2e8f0;">GE 비즈니스 방법론</text>
    <text x="65" y="105" style="font-size: 12px; fill: #94a3b8;">→ 세일즈, 변화관리, 인재육성</text>

    <circle cx="30" cy="130" r="5" fill="#a5b4fc"/>
    <text x="45" y="135" style="font-size: 15px; fill: #e2e8f0;">세일즈 프로세스 13가지</text>
    <text x="65" y="155" style="font-size: 12px; fill: #94a3b8;">→ GE 프로의 실전 노하우</text>

    <circle cx="30" cy="180" r="5" fill="#a5b4fc"/>
    <text x="45" y="185" style="font-size: 15px; fill: #e2e8f0;">변화리더십 101</text>
  </g>

  <!-- Section 2: Core Concepts -->
  <g transform="translate(620, 340)">
    <rect x="0" y="0" width="430" height="200" rx="15" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(74, 222, 128, 0.3)" stroke-width="2"/>
    <text x="215" y="35" text-anchor="middle" style="font-size: 24px; font-weight: bold; fill: #48bb78;">💡 핵심 개념</text>
    <line x1="20" y1="50" x2="410" y2="50" stroke="rgba(74, 222, 128, 0.2)" stroke-width="1"/>

    <text x="30" y="85" style="font-size: 16px; font-weight: bold; fill: #86efac;">4E + V 인재육성</text>
    <text x="50" y="105" style="font-size: 12px; fill: #94a3b8;">Energy, Energize, Edge, Execute, Values</text>

    <text x="30" y="135" style="font-size: 16px; font-weight: bold; fill: #86efac;">9가지 변화 리더십</text>
    <text x="50" y="155" style="font-size: 12px; fill: #94a3b8;">잭 웰치의 리더십 자질 체계</text>

    <text x="30" y="185" style="font-size: 16px; font-weight: bold; fill: #86efac;">위크아웃 & 액션러닝</text>
  </g>

  <!-- Section 3: Source Books -->
  <g transform="translate(150, 560)">
    <rect x="0" y="0" width="450" height="180" rx="15" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="2"/>
    <text x="225" y="35" text-anchor="middle" style="font-size: 24px; font-weight: bold; fill: #a78bfa;">📚 원본 서적</text>
    <line x1="20" y1="50" x2="430" y2="50" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1"/>

    <text x="30" y="80" style="font-size: 13px; fill: #cbd5e1;">📘 1% 위대한 기업은 어떻게 일하는가 (6.7MB)</text>
    <text x="30" y="105" style="font-size: 13px; fill: #cbd5e1;">📘 GE의 세일즈 노트 (2.6MB)</text>
    <text x="30" y="130" style="font-size: 13px; fill: #cbd5e1;">📘 GE의 변화리더십 101 (1.7MB)</text>
    <text x="30" y="155" style="font-size: 13px; fill: #cbd5e1;">📘 GE는 어떻게 수퍼급 인재를 만드는가 (742KB)</text>
  </g>

  <!-- Section 4: Key People -->
  <g transform="translate(620, 560)">
    <rect x="0" y="0" width="430" height="180" rx="15" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(251, 146, 60, 0.3)" stroke-width="2"/>
    <text x="215" y="35" text-anchor="middle" style="font-size: 24px; font-weight: bold; fill: #fdba74;">👥 핵심 인물</text>
    <line x1="20" y1="50" x2="410" y2="50" stroke="rgba(251, 146, 60, 0.2)" stroke-width="1"/>

    <text x="30" y="85" style="font-size: 18px; font-weight: bold; fill: #fbbf24;">잭 웰치 (Jack Welch)</text>
    <text x="50" y="108" style="font-size: 12px; fill: #94a3b8;">• GE 회장 20년 (1981-2001)</text>
    <text x="50" y="128" style="font-size: 12px; fill: #94a3b8;">• 시가총액 30배 증가</text>

    <text x="250" y="85" style="font-size: 18px; font-weight: bold; fill: #fbbf24;">심재우 저자</text>
    <text x="270" y="108" style="font-size: 12px; fill: #94a3b8;">• GE 15년 실무 경험</text>
    <text x="270" y="128" style="font-size: 12px; fill: #94a3b8;">• 6권 저서</text>
  </g>

  <!-- Footer -->
  <text x="600" y="770" text-anchor="middle" style="font-size: 14px; fill: #64748b;">
    생성일: 2026-06-06 | Knowledge Wiki &amp; Ontology Vault | 심재우 저서 지식 저장소
  </text>
</svg>
